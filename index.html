<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HVM Public School</title>

<style>

body{
    margin:0;
    font-family: Arial;
    color:white;
    text-align:center;
    overflow:hidden;
}

/* Motion Background */

body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:200%;
    height:200%;
    background:url("background.png");
    background-size:cover;
    animation:moveBg 20s linear infinite;
    z-index:-1;
}

@keyframes moveBg{
    0%{
        transform:translate(0,0);
    }
    50%{
        transform:translate(-10%,-10%);
    }
    100%{
        transform:translate(0,0);
    }
}

header{
    padding:40px;
}

h1{
    color:yellow;
    font-size:35px;
}

button{
    padding:15px 30px;
    font-size:18px;
    background:green;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:darkgreen;
}

.address{
    margin-top:20px;
    font-size:18px;
}

</style>

</head>

<body>

<header>

<h1>HVM PUBLIC SCHOOL</h1>

<div class="address">
Madanganj Kishangarh<br>
Near MK Marriage Garden
</div>

<br><br>

<a href="call.html">
<button>Call Now</button>
</a>

</header>

</body>
</html>
