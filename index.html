<!DOCTYPE html>
<html lang="en">
<head>

<title>Contact - HVM Public School</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#141e30,#243b55);

    text-align:center;
}

.container{
    padding:50px 20px;
}

h2{
    color:#00ffcc;
}

.info{

    background: linear-gradient(45deg,#ff512f,#dd2476);
    color:white;
    cursor:pointer;
    text-decoration:none;
    display:inline-block;
    transition:0.3s;
}

.call-btn:hover{
    transform:scale(1.1);
}
</style>
</head>

<body>

<div class="container">
    <h2>Principal: Narendra Sharma</h2>

    <div class="info">
        <p>Phone Number: 9261190322</p>
