<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Call Page</title>

<style>

body{
margin:0;
font-family:Arial;
text-align:center;
color:white;
}

/* Motion Background */

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:200%;
height:200%;
background:url("https://images.unsplash.com/photo-1557683316-973673baf926") no-repeat center;
background-size:cover;
animation:movebg 25s linear infinite;
z-index:-1;
}

@keyframes movebg{
0%{transform:translate(0,0);}
50%{transform:translate(-10%,-10%);}
100%{transform:translate(0,0);}
}

h1{
margin-top:60px;
}

button{
padding:15px 30px;
font-size:18px;
margin:10px;
border:none;
border-radius:10px;
cursor:pointer;
}

.call{
background:green;
color:white;
}

.whatsapp{
background:#25D366;
color:white;
}

.home{
background:orange;
color:white;
}

</style>

</head>

<body>

<h1>PRINCIPAL NUMBER</h1>
<h2>9261190322</h2>

<a href="tel:9261190322">
<button class="call">Call Now</button>
</a>

<br>

<a href="https://wa.me/919261190322">
<button class="whatsapp">WhatsApp</button>
</a>

<br>

<a href="index.html">
<button class="home">Home</button>
</a>

</body>
</html>
