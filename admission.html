<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #ff9a9e, #fad0c4);
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Admission Form</h2>

    <form action="#" method="post">
        <input type="text" placeholder="Student Name" required>
        <input type="text" placeholder="Class" required>
        <input type="text" placeholder="Parent Name" required>
        <input type="tel" placeholder="Mobile Number" value="9261190322" required>
        <button type="submit">Submit</button>
    </form>

</div>

</body>
</html>
